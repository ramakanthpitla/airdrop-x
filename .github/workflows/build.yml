name: Build APK and DMG
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter create --platforms=android --org com.airdropx --project-name airdrop_x .
      - run: python3 tools/patch_platform.py
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: {name: AirdropX-apk, path: build/app/outputs/flutter-apk/app-release.apk}
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter create --platforms=macos --org com.airdropx --project-name airdrop_x .
      - run: python3 tools/patch_platform.py
      - run: flutter pub get
      - run: flutter build macos --release
      - run: hdiutil create -volname "AirDrop X" -srcfolder build/macos/Build/Products/Release/airdrop_x.app -ov -format UDZO AirdropX.dmg
      - uses: actions/upload-artifact@v4
        with: {name: AirdropX-dmg, path: AirdropX.dmg}
